<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#233240"/>
      <stop offset="100%" stop-color="#3B5166"/>
    </linearGradient>
    <linearGradient id="ft-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9FA"/>
      <stop offset="100%" stop-color="#E7ECEF"/>
    </linearGradient>
    <linearGradient id="ft-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F7CAC"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <linearGradient id="ft-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5F72"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#ft-bg)"/>

  <!-- soft ambient blobs -->
  <circle cx="60" cy="50" r="90" fill="#4F7CAC" opacity="0.14"/>
  <circle cx="430" cy="270" r="110" fill="#1B2733" opacity="0.35"/>

  <!-- laptop screen -->
  <g>
    <rect x="120" y="46" width="240" height="164" rx="10" fill="#1B2733"/>
    <rect x="130" y="56" width="220" height="144" rx="4" fill="url(#ft-screen)"/>

    <!-- browser/app top bar -->
    <rect x="130" y="56" width="220" height="20" rx="4" fill="#2C3E50"/>
    <circle cx="140" cy="66" r="2.6" fill="#E74C3C" opacity="0.8"/>
    <circle cx="149" cy="66" r="2.6" fill="#F1C40F" opacity="0.8"/>
    <circle cx="158" cy="66" r="2.6" fill="#2ECC71" opacity="0.8"/>
    <rect x="215" y="61" width="120" height="10" rx="3" fill="#ffffff" opacity="0.35"/>

    <!-- sidebar -->
    <rect x="130" y="76" width="46" height="124" fill="#2C3E50" opacity="0.92"/>
    <rect x="140" y="90" width="26" height="6" rx="3" fill="#7FB2E5"/>
    <rect x="140" y="106" width="26" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="140" y="122" width="26" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="140" y="138" width="26" height="6" rx="3" fill="#ffffff" opacity="0.35"/>

    <!-- calendar / booking grid -->
    <g>
      <rect x="184" y="86" width="158" height="26" rx="5" fill="#ffffff"/>
      <rect x="192" y="94" width="60" height="8" rx="3" fill="#2C3E50" opacity="0.6"/>
      <rect x="300" y="92" width="34" height="12" rx="6" fill="url(#ft-accent)"/>

      <rect x="184" y="120" width="76" height="70" rx="6" fill="#ffffff"/>
      <rect x="192" y="128" width="40" height="7" rx="3" fill="#2C3E50" opacity="0.55"/>
      <rect x="192" y="144" width="60" height="6" rx="3" fill="#BDC3C7"/>
      <rect x="192" y="156" width="46" height="6" rx="3" fill="#BDC3C7"/>
      <rect x="192" y="172" width="30" height="12" rx="6" fill="#2ECC71" opacity="0.85"/>

      <rect x="266" y="120" width="76" height="34" rx="6" fill="#ffffff"/>
      <rect x="274" y="128" width="50" height="7" rx="3" fill="#2C3E50" opacity="0.55"/>
      <rect x="274" y="140" width="34" height="6" rx="3" fill="#BDC3C7"/>

      <rect x="266" y="160" width="76" height="30" rx="6" fill="#ffffff"/>
      <rect x="274" y="168" width="50" height="7" rx="3" fill="#2C3E50" opacity="0.55"/>
      <rect x="274" y="180" width="26" height="6" rx="3" fill="#E67E22" opacity="0.8"/>
    </g>
  </g>

  <!-- laptop base -->
  <path d="M100 210 L380 210 L400 236 L80 236 Z" fill="url(#ft-base)"/>
  <rect x="215" y="212" width="50" height="4" rx="2" fill="#1B2733" opacity="0.5"/>

  <!-- floating status chips -->
  <g>
    <rect x="352" y="150" width="86" height="30" rx="15" fill="#ffffff" opacity="0.95"/>
    <circle cx="368" cy="165" r="6" fill="#2ECC71"/>
    <rect x="380" y="160" width="48" height="10" rx="4" fill="#2C3E50" opacity="0.55"/>

    <rect x="30" y="120" width="76" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
    <circle cx="45" cy="133" r="5.5" fill="#4F7CAC"/>
    <rect x="56" y="129" width="40" height="8" rx="4" fill="#2C3E50" opacity="0.5"/>
  </g>
</svg>
