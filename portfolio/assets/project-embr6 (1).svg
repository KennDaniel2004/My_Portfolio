<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="em-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16222E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <linearGradient id="em-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2733"/>
      <stop offset="100%" stop-color="#0F1720"/>
    </linearGradient>
    <linearGradient id="em-icon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#2E86C1"/>
    </linearGradient>
    <linearGradient id="em-icon2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58D68D"/>
      <stop offset="100%" stop-color="#28B463"/>
    </linearGradient>
    <linearGradient id="em-icon3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5B041"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <linearGradient id="em-icon4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC7063"/>
      <stop offset="100%" stop-color="#CB4335"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#em-bg)"/>
  <circle cx="410" cy="60" r="120" fill="#4F7CAC" opacity="0.12"/>
  <circle cx="50" cy="280" r="100" fill="#28B463" opacity="0.10"/>

  <!-- phone -->
  <rect x="180" y="30" width="120" height="260" rx="22" fill="url(#em-phone)"/>
  <rect x="188" y="46" width="104" height="228" rx="4" fill="#F4F6F7"/>
  <rect x="222" y="36" width="36" height="6" rx="3" fill="#0F1720"/>

  <!-- status bar -->
  <rect x="188" y="46" width="104" height="16" fill="#E9EDEF"/>
  <circle cx="198" cy="54" r="2" fill="#7F8C8D"/>
  <rect x="264" y="51" width="20" height="6" rx="2" fill="#7F8C8D"/>

  <!-- app header -->
  <rect x="188" y="62" width="104" height="30" fill="#2C3E50"/>
  <rect x="198" y="72" width="60" height="10" rx="3" fill="#ffffff" opacity="0.85"/>

  <!-- app icon grid (matches monitoring app icon layout) -->
  <g>
    <rect x="200" y="104" width="34" height="34" rx="9" fill="url(#em-icon1)"/>
    <rect x="246" y="104" width="34" height="34" rx="9" fill="url(#em-icon2)"/>
    <rect x="200" y="150" width="34" height="34" rx="9" fill="url(#em-icon3)"/>
    <rect x="246" y="150" width="34" height="34" rx="9" fill="url(#em-icon4)"/>
    <rect x="200" y="196" width="34" height="34" rx="9" fill="#8E6ACB"/>
    <rect x="246" y="196" width="34" height="34" rx="9" fill="#48C9B0"/>

    <circle cx="217" cy="121" r="7" fill="#ffffff" opacity="0.9"/>
    <path d="M262 112 l6 6 -6 6" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <rect x="211" y="161" width="12" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
    <path d="M255 158 l8 16 M271 158 l-8 16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <path d="M211 207 q6 -10 12 0 q6 -10 12 0" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.9"/>
    <circle cx="263" cy="213" r="7" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.9"/>
  </g>

  <!-- bottom nav dots -->
  <circle cx="228" cy="252" r="3" fill="#2C3E50" opacity="0.8"/>
  <circle cx="240" cy="252" r="3" fill="#BDC3C7"/>
  <circle cx="252" cy="252" r="3" fill="#BDC3C7"/>

  <!-- floating sensor reading chips -->
  <g>
    <rect x="60" y="70" width="96" height="46" rx="12" fill="#ffffff" opacity="0.96"/>
    <rect x="72" y="82" width="40" height="8" rx="4" fill="#7F8C8D"/>
    <rect x="72" y="96" width="60" height="10" rx="4" fill="#28B463"/>

    <rect x="330" y="200" width="100" height="50" rx="12" fill="#ffffff" opacity="0.96"/>
    <rect x="342" y="212" width="46" height="8" rx="4" fill="#7F8C8D"/>
    <rect x="342" y="226" width="70" height="10" rx="4" fill="#2E86C1"/>
    <path d="M342 246 l10 -8 8 6 12 -12" stroke="#E67E22" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
